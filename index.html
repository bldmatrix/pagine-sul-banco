<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagine sul banco</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fbf5e9;--card:#fffaf0;--ink:#2b2a33;--muted:#6b6672;--c1:#c8553d;--c2:#3d7a73;--c3:#e0a82e;--line:#e6dcc6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1d24;--card:#2a2731;--ink:#f3ecdc;--muted:#b3acbb;--line:#3c3846}}
:root[data-theme="dark"]{--bg:#1f1d24;--card:#2a2731;--ink:#f3ecdc;--muted:#b3acbb;--line:#3c3846}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,Georgia,sans-serif;line-height:1.7;font-size:17px}
h1,h2,h3,.logo{font-family:Fraunces,Georgia,serif;line-height:1.2;margin:0}
a{color:inherit;text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;padding:0 22px}
.narrow{max-width:720px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px dashed var(--line)}
.logo{font-weight:700;font-size:1.25rem}
nav{display:flex;flex-wrap:wrap;gap:8px 20px;font-weight:600;font-size:.95rem}
nav a:hover,nav a.on{color:var(--c1)}
nav a.on{border-bottom:2px solid var(--c1)}
.hero{text-align:center;padding:64px 0 44px}
.hero small,.sec small{letter-spacing:.28em;color:var(--c2);font-weight:600;font-size:.8rem}
.hero h1{font-size:clamp(2rem,6vw,3.3rem);max-width:15em;margin:14px auto 18px}
.hero h1 em{color:var(--c1)}
.hero p{color:var(--muted);max-width:32em;margin:0 auto}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;margin:20px 0 64px}
.big{background:var(--card);border:2px solid var(--line);border-radius:26px 30px 24px 32px;padding:32px 26px;text-align:center;transition:transform .2s}
.big:hover{transform:rotate(-1deg) translateY(-4px)}
.big .em{font-size:2.5rem}.big h3{font-size:1.4rem;margin:8px 0}.big p{color:var(--muted);margin:0 0 12px}.big b{color:var(--c1)}.big.b b{color:var(--c2)}
.sec{text-align:center;margin:10px 0 28px}.sec h2{font-size:2rem;margin-top:6px}.sec p{color:var(--muted);margin:8px auto 0;max-width:34em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;margin-bottom:56px}
.post{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:block;transition:transform .2s}
.post:hover{transform:translateY(-4px)}
.cover{height:160px;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#fff}
.post .t{padding:16px 20px 20px}
.tag{font-size:.72rem;letter-spacing:.15em;font-weight:600;color:var(--c1)}
.post h3{font-size:1.2rem;margin:6px 0 8px}.post .more{font-weight:600;color:var(--c2)}
.about{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--card);border:2px dashed var(--line);border-radius:28px;padding:34px;margin:30px 0 60px}
.av{font-size:4rem}
.btn{display:inline-block;margin-top:10px;background:var(--c1);color:#fff;padding:10px 22px;border-radius:99px;font-weight:600}
@media(max-width:560px){.about{grid-template-columns:1fr;text-align:center}}
.quote{text-align:center;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.5rem;color:var(--c2);margin:0 0 60px}
.page{padding:44px 0 30px}.page h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:8px 0 16px}.page h2{font-size:1.35rem;margin:30px 0 8px}
.page p{margin:0 0 14px}
.crumb{color:var(--c1);letter-spacing:.2em;font-weight:600;font-size:.8rem}
.meta{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 20px;margin:18px 0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 20px;font-size:.95rem}
.meta span{color:var(--muted)}
.big-cover{height:260px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:5rem;color:#fff;margin-bottom:18px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.tags i{font-style:normal;font-size:.8rem;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 12px;color:var(--muted)}
.rel{border-top:1px dashed var(--line);margin-top:40px;padding-top:24px}
.rel h3{margin-bottom:14px}
.rel a.l{display:block;padding:6px 0;color:var(--c2);font-weight:600}
footer{text-align:center;padding:34px 0 46px;border-top:1px dashed var(--line);color:var(--muted)}
footer .logo{color:var(--ink)}footer nav{justify-content:center;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="logo" href="#/">Pagine sul banco</a>
  <nav id="nav">
    <a href="#/albi">Scopri gli albi</a><a href="#/classe">Portali in classe</a><a href="#/chi-sono">Chi sono</a><a href="#/contatti">Contatti</a>
  </nav>
</header>
<main id="app"></main>
</div>
<footer><div class="wrap">
  <div class="logo">Pagine sul banco</div>
  <div>Libri • Scuola • Idee</div>
  <nav><a href="#/contatti">Instagram</a><a href="#/privacy">Privacy</a><a href="#/contatti">Contatti</a></nav>
</div></footer>

<script>
/* ====== CONTENUTI: per aggiungere un articolo, copia un blocco e modificalo ====== */
const posts=[
 {id:'il-giardino-delle-emozioni',type:'albo',title:'Il giardino delle emozioni',emoji:'📖',color:'#c8553d',
  meta:{'Autore':'Nome Autore','Illustratore':'Nome Illustratore','Editore':'Nome Editore','Età consigliata':'6-8 anni'},
  tags:['Albi illustrati','Scuola primaria','Emozioni','6-8 anni'],
  sections:[['🌱 Perché ci è piaciuto','Qui va il testo della recensione: cosa ci ha colpito delle immagini, del ritmo, delle parole.'],
            ['💭 Una storia che fa pensare','Qui una riflessione educativa: quali temi apre, quali domande nascono nei bambini.'],
            ['🏫 Lo porterei in classe?','Qui il consiglio per le colleghe: come, quando e con quale classe leggerlo.']]},
 {id:'il-piccolo-esploratore',type:'albo',title:'Il piccolo esploratore',emoji:'🧭',color:'#3d7a73',
  meta:{'Autore':'Nome Autore','Illustratore':'Nome Illustratore','Editore':'Nome Editore','Età consigliata':'5-7 anni'},
  tags:['Albi illustrati','Avventura','5-7 anni'],
  sections:[['🌱 Perché ci è piaciuto','Testo di esempio da sostituire con la tua recensione.'],
            ['💭 Una storia che fa pensare','Testo di esempio da sostituire.'],
            ['🏫 Lo porterei in classe?','Testo di esempio da sostituire.']]},
 {id:'un-viaggio-tra-colori-e-parole',type:'classe',title:'Un viaggio tra colori e parole',emoji:'🎨',color:'#e0a82e',
  meta:{'Albo di partenza':'Il giardino delle emozioni','Classe':'Seconda','Materia':'Arte / Italiano','Tempo':'2 ore'},
  tags:['Laboratorio','Arte','Italiano','Classe seconda'],
  related:'il-giardino-delle-emozioni',
  sections:[['💡 L\'idea','Da dove nasce l\'attività e quale obiettivo ha.'],
            ['👧 Cosa abbiamo fatto','Il racconto, passo dopo passo, di ciò che è successo.'],
            ['🧰 Materiali','Cartoncini, tempere, pennelli… (elenco di esempio).'],
            ['🖍️ Il laboratorio','Le istruzioni, in modo che altre insegnanti possano rifarlo.'],
            ['✨ Cosa è successo in classe','Le reazioni dei bambini, i risultati, le osservazioni.']]}
];
const labels={albo:['SCOPRI GLI ALBI','RECENSIONE','Leggi →'],classe:['PORTALI IN CLASSE','IN CLASSE','Scopri →']};
const $=s=>document.querySelector(s),app=$('#app');
const card=p=>`<a class="post" href="#/post/${p.id}"><div class="cover" style="background:${p.color}">${p.emoji}</div><div class="t"><span class="tag">${labels[p.type][1]}</span><h3>${p.title}</h3><span class="more">${labels[p.type][2]}</span></div></a>`;
const home=()=>`
<section class="hero"><div style="font-size:1.8rem">✨</div><small>PAGINE SUL BANCO</small>
<h1>Quando un albo arriva tra i banchi, può succedere qualcosa di <em>meraviglioso</em>.</h1>
<p>Recensioni, idee e attività didattiche nate dall'incontro tra libri e scuola.</p></section>
<section class="two">
<a class="big" href="#/albi"><div class="em">📚</div><h3>Scopri gli albi</h3><p>Recensioni e consigli</p><b>SCOPRI →</b></a>
<a class="big b" href="#/classe"><div class="em">✏️</div><h3>Portali in classe</h3><p>Attività e laboratori</p><b>ENTRA →</b></a></section>
<div class="sec"><small>✨ DALLE PAGINE ALLA CLASSE</small><h2>Gli ultimi articoli</h2></div>
<div class="grid">${posts.slice().reverse().slice(0,3).map(card).join('')}</div>
<section class="about"><div class="av">👩‍🏫</div><div><h2>Chi sono</h2><p>Sono un'insegnante di scuola primaria e amo portare gli albi illustrati tra i banchi…</p><a class="btn" href="#/chi-sono">Scopri la storia →</a></div></section>
<p class="quote">"Una storia può iniziare da una pagina."</p>`;
const list=t=>`<div class="page"><div class="sec"><small>${labels[t][0]}</small><h2>${t=='albo'?'Recensioni e consigli':'Attività e laboratori'}</h2>
<p>${t=='albo'?'Gli albi illustrati che abbiamo letto, amato e portato in classe.':'Idee e laboratori nati dagli albi, pronti da riprendere in classe.'}</p></div>
<div class="grid">${posts.filter(p=>p.type==t).map(card).join('')}</div></div>`;
const post=id=>{const p=posts.find(x=>x.id==id);if(!p)return notfound();
 const others=posts.filter(x=>x.id!=id&&x.type==p.type),opp=posts.filter(x=>x.type!=p.type);
 const link=x=>`<a class="l" href="#/post/${x.id}">→ ${x.title}</a>`;
 return `<article class="page narrow"><a class="crumb" href="#/${p.type=='albo'?'albi':'classe'}">${p.emoji} ${labels[p.type][0]}</a>
<h1>${p.title}</h1><div class="tags">${p.tags.map(t=>`<i>${t}</i>`).join('')}</div>
<div class="big-cover" style="background:${p.color}">${p.emoji}</div>
<div class="meta">${Object.entries(p.meta).map(([k,v])=>`<div><span>${k}:</span> <b>${v}</b></div>`).join('')}</div>
${p.sections.map(s=>`<h2>${s[0]}</h2><p>${s[1]}</p>`).join('')}
<div class="rel"><h3>${p.type=='albo'?'Ti interessa questo albo?':'Ti è piaciuta questa attività?'}</h3>
${others.map(link).join('')}${opp.map(link).join('')}<a class="l" href="#/${p.type=='albo'?'albi':'classe'}">→ Tutti gli articoli di questa sezione</a></div></article>`};
const about=()=>`<div class="page narrow"><div style="text-align:center"><div class="av">👩‍🏫</div><h1>Chi sono</h1></div>
<p>Sono un'insegnante di scuola primaria e amo portare gli albi illustrati tra i banchi. Questo spazio nasce per raccogliere i libri che mi hanno colpita e le attività che ne sono nate.</p>
<p>Qui andrà la tua storia: come è iniziata la passione per gli albi, che classi hai, cosa speri di condividere con colleghe e genitori.</p>
<p class="quote" style="margin:30px 0">"Una storia può iniziare da una pagina."</p></div>`;
const contacts=()=>`<div class="page narrow"><h1>Contatti</h1>
<p>Vuoi segnalarmi un albo, proporre una collaborazione o semplicemente salutare? Scrivimi.</p>
<p>✉️ <a style="color:var(--c1);font-weight:600" href="mailto:info@esempio.it">info@esempio.it</a><br>📷 Instagram: <b>@paginesulbanco</b></p>
<p style="color:var(--muted);font-size:.9rem">(Indirizzo email e profilo Instagram di esempio: da sostituire.)</p></div>`;
const privacy=()=>`<div class="page narrow"><h1>Privacy</h1>
<p>Questo sito è informativo. Non usa cookie di profilazione, non contiene moduli e non raccoglie dati personali direttamente.</p>
<h2>Font</h2><p>I caratteri (Google Fonts) sono caricati da server di Google, che può ricevere l'indirizzo IP del visitatore.</p>
<h2>Contatti</h2><p>Se scrivi via email o Instagram, i dati che invii sono usati solo per risponderti.</p>
<h2>Immagini di minori</h2><p>Le foto delle attività in classe sono pubblicate solo con il consenso delle famiglie.</p>
<p style="color:var(--muted);font-size:.9rem">Testo di base: da far verificare e completare (titolare, diritti GDPR, contatto) prima della pubblicazione.</p></div>`;
const notfound=()=>`<div class="page narrow"><h1>Pagina non trovata</h1><p><a class="btn" href="#/">Torna alla home</a></p></div>`;
function route(){
 const [,r,a]=(location.hash||'#/').slice(1).split('/');
 app.innerHTML=!r?home():r=='albi'?list('albo'):r=='classe'?list('classe'):r=='post'?post(a):r=='chi-sono'?about():r=='contatti'?contacts():r=='privacy'?privacy():notfound();
 document.querySelectorAll('#nav a').forEach(x=>x.classList.toggle('on',x.getAttribute('href')=='#/'+r));
 const p=posts.find(x=>x.id==a);document.title=(r=='post'&&p?p.title+' · ':'')+'Pagine sul banco';scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
